services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing_service
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing_service"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports: ["3002:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/billing_service?schema=public
      JWT_SECRET: changeme
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      APP_URL: http://localhost:3002
      NODE_ENV: production
