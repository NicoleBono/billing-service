services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing_service
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing_service"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3
    ports: ["4566:4566"]
    environment:
      SERVICES: sns,sqs
      DEFAULT_REGION: us-east-1

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
      localstack: { condition: service_started }
    ports: ["3002:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/billing_service?schema=public
      JWT_SECRET: changeme
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-TEST-fake-token}
      APP_URL: http://localhost:3002
      NODE_ENV: production
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      SAGA_SNS_TOPIC_ARN: ${SAGA_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:oficina-saga-events}
      SAGA_SQS_QUEUE_URL: ${SAGA_SQS_QUEUE_URL:-http://localstack:4566/000000000000/billing-saga-queue}
