apiVersion: v1
kind: Secret
metadata:
  name: billing-secret
  namespace: oficina
type: Opaque
stringData:
  # Preencher com o output ssm_billing_database_url_path do infra-database
  # (ou o valor real da connection string do DocumentDB).
  DATABASE_URL: "mongodb://usuario:senha@host:27017/billing"
  MP_ACCESS_TOKEN: "TEST-xxxxxxxx-xxxxxx-xxxxxxxxxxxxxxxxxxxxxxxx-xxxxxxxxx"
